<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>웹소설 표지 일러스트 모음</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #ffffff;
    --like: #e0245e;
    --surface: #f7f7f8;
    --line: #e9e9ec;
    --text: #1c1c1e;
    --muted: #6e6e73;
    --faint: #a1a1a6;
    --accent: #111111;
    --radius: 14px;
    /* 노치·홈 인디케이터 등 기기 안전 영역. 헤더 높이에 위쪽 inset 을 포함해 헤더 기준으로 붙는 요소들이 함께 내려온다 */
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --header-h: calc(64px + var(--sat));
    --panel-w: 264px;
    --col-w: 240px;
    --gap: 14px;
    --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, "Noto Sans KR", "Malgun Gothic", sans-serif;
  }
  * { box-sizing: border-box; }
  /* 스크롤바 자리를 늘 비워 둔다. 스크롤바가 생기고 사라질 때마다 격자 폭이 바뀌면, 페이지 높이가 화면과 비슷할 때 재배치가 끝없이 되풀이된다 */
  html { scrollbar-gutter: stable; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; -webkit-font-smoothing: antialiased; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  a { color: inherit; }

  /* ---------- header ---------- */
  .header { position: sticky; top: 0; z-index: 30; height: var(--header-h); display: flex; align-items: center; gap: 14px; padding: var(--sat) calc(20px + var(--sar)) 0 calc(20px + var(--sal)); background: rgba(255,255,255,.88); backdrop-filter: saturate(180%) blur(14px); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; margin-left: -8px; font-weight: 700; letter-spacing: -.01em; font-size: 16px; white-space: nowrap; }
  .search { flex: 999 1 auto; min-width: 160px; max-width: 560px; position: relative; }
  .search input { width: 100%; height: 40px; padding: 0 40px 0 40px; border-radius: 999px; border: 1px solid transparent; background: var(--surface); outline: none; transition: .15s; }
  .search input:focus { background: #fff; border-color: #cfcfd4; box-shadow: 0 0 0 4px rgba(0,0,0,.04); }
  .search svg { position: absolute; left: 14px; top: 12px; width: 16px; height: 16px; color: var(--faint); }
  .search input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .search .clear { position: absolute; right: 8px; top: 8px; width: 24px; height: 24px; border-radius: 50%; color: var(--muted); display: none; }
  .search .clear:hover { background: var(--line); }
  .search.has .clear { display: grid; place-items: center; }
  .spacer { flex: 1 1 0; min-width: 0; }
  .ctl { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .ctl label { display: flex; align-items: center; gap: 8px; }
  input[type=range] { -webkit-appearance: none; direction: rtl; width: 72px; height: 4px; background: var(--line); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; border: 1px solid #cfcfd4; box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: pointer; }
  .select { height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; color: var(--text); font-size: 13px; }
  .select:disabled { color: var(--faint); background: var(--surface); cursor: default; }
  .iconbtn { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--muted); }
  .iconbtn:hover { background: var(--surface); color: var(--text); }
  .iconbtn.on { background: var(--accent); color: #fff; }
  /* 흑백 표시 체크박스. 헤더의 썸네일 슬라이더 옆과 상세창 정보란 오른쪽 아래에 같은 모양으로 둔다 */
  .opt.gray { padding: 6px; font-size: 12px; color: var(--muted); }
  .lb .graymeta { margin: auto -6px -6px auto; }

  /* ---------- layout ---------- */
  .layout { display: flex; min-height: calc(100vh - var(--header-h)); }
  .panel { width: var(--panel-w); flex: none; position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h)); display: flex; flex-direction: column; border-right: 1px solid var(--line); background: #fff; transition: margin .2s ease; }
  .panel.hidden { margin-left: calc(-1 * var(--panel-w)); }
  .resizer { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 2; }
  .resizer::after { content: ""; position: absolute; left: 3px; top: 0; width: 2px; height: 100%; background: var(--accent); opacity: 0; transition: opacity .15s; }
  .resizer:hover::after, body.resizing .resizer::after { opacity: .6; }
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing .panel, body.noanim .panel { transition: none; }
  .panel-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px calc(24px + var(--sab)) calc(16px + var(--sal)); scrollbar-width: thin; }
  .panel-top { flex: none; padding: 12px 12px 10px calc(12px + var(--sal)); border-bottom: 1px solid var(--line); background: #fff; }
  .resetall { width: 100%; height: 40px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background .15s, transform .1s; }
  .resetall:hover { background: #333; }
  .resetall:active { transform: scale(.98); }
  /* 선택된 필터가 없으면 자리는 그대로 두고 비활성으로만 보여 준다 */
  .resetall:disabled { background: var(--surface); color: var(--faint); cursor: default; transform: none; }
  .resetall:disabled .n { display: none; }
  .resetall .n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: rgba(255,255,255,.24); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
  .group { margin-bottom: 22px; }
  .group h3 { margin: 0 0 8px; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
  /* 헤더 양쪽 묶음 안의 이름·접기·개수·초기화를 모두 세로 중앙에 맞춘다 */
  .group h3 > span { display: inline-flex; align-items: center; gap: 4px; }
  .group h3 .count { letter-spacing: 0; text-transform: none; }
  /* 그룹 헤더 안에서는 한 단계 작게 둔다 */
  .group h3 .clr { display: none; font-size: 11px; }
  .group.active h3 .clr { display: inline; }
  /* 그룹 이름 옆의 접기·펼치기. 목록이 기본 표시 수를 넘을 때만 보이며, 초기화와 달리 밑줄 없이 연한 색을 쓴다 */
  .group h3 .fold { font-size: 11px; text-decoration: none; color: #d0d0d2; }
  .group h3 .fold:hover { color: var(--text); }
  .group h3 .fold[hidden] { display: none; }
  /* 필터 그룹의 찾기 입력은 메인 검색바와 같은 스타일의 작은 변형이다 */
  .search.sm { flex: none; min-width: 0; max-width: none; margin-bottom: 8px; }
  .search.sm input { height: 32px; font-size: 12px; padding: 0 30px 0 32px; }
  .search.sm svg { left: 11px; top: 9px; width: 14px; height: 14px; }
  .search.sm .clear { right: 5px; top: 5px; width: 22px; height: 22px; font-size: 11px; }
  .opts { display: flex; flex-direction: column; gap: 2px; }
  /* 접힌 상태에서는 아래 56px 구간을 흰색으로 덮는다. 바닥 6px은 완전한 흰색이고, 그 위로 올라가면서 흰색이 걷힌다 */
  .opts.clipped { -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 18x), transparent calc(100% - 8px)); mask-image: linear-gradient(to bottom, #000 calc(100% - 18px), transparent calc(100% - 8px)); }
  .more { display: block; width: 100%; margin-top: 0; }
  .more[hidden] { display: none; }
  .opt { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 8px; font-size: 13px; cursor: pointer; user-select: none; }
  .opt:hover { background: var(--surface); }
  .opt input { display: none; }
  .opt .box { width: 16px; height: 16px; flex: none; border-radius: 5px; border: 1.5px solid #c9c9cf; display: grid; place-items: center; transition: .12s; }
  .opt .box svg { width: 10px; height: 10px; opacity: 0; color: #fff; }
  .opt input:checked + .box { background: var(--accent); border-color: var(--accent); }
  .opt input:checked + .box svg { opacity: 1; }
  .opt .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 숫자 칸 너비를 고정해 그 왼쪽의 별표가 행마다 밀리지 않고 한 열에 서게 한다 */
  .opt .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 2ch; text-align: right; }
  /* 결과가 없는 항목은 흰색에 가깝게 옅게 두어, 접힌 목록 끝의 흐려지는 구간과 구분되게 한다 */
  .opt.dim { opacity: .28; }
  /* 필터 항목과 그룹 헤더가 함께 쓰는 별표. 사파리는 button 안의 grid 정렬이 어긋나므로 flex 로 가운데 맞추고 svg 를 블록으로 둔다 */
  .fav { flex: none; display: flex; align-items: center; justify-content: center; align-self: center; line-height: 0; color: var(--faint); transition: opacity .12s, color .12s; }
  .fav:hover { color: var(--text); }
  .fav.on, .fav.on:hover { color: #f0b429; }
  .fav svg { display: block; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
  .fav.on svg { fill: currentColor; }
  .opt .fav { width: 18px; height: 18px; margin-right: -4px; opacity: 0; }
  .opt:hover .fav, .opt .fav.on, .opt .fav:focus-visible { opacity: 1; }
  .opt .fav svg { width: 13px; height: 13px; }
  .more { font-size: 12px; color: var(--muted); padding: 6px 8px; text-align: left; border-radius: 8px; }
  .more:hover { color: var(--text); background: var(--surface); }
  .genre-mode { display: flex; gap: 4px; padding: 3px; background: var(--surface); border-radius: 8px; margin-bottom: 8px; }
  .genre-mode button { flex: 1; height: 26px; border-radius: 6px; font-size: 12px; color: var(--muted); }
  .genre-mode button.on { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  /* 열이 줄면 카드 폭은 바로 넓어지고 위치는 애니메이션으로 옮겨 가므로, 그 사이 오른쪽 열 카드가 격자 밖으로 삐져나온다.
     잘라 두지 않으면 모바일 브라우저가 넓어진 문서에 맞춰 페이지 전체를 축소하고 되돌리지 않는다. 카드 초점 테두리가 잘리지 않게 격자 여백 바깥에서 자른다 */
  .main { flex: 1; min-width: 0; overflow-x: clip; }
  .toolbar { display: flex; align-items: center; gap: 10px; padding: 14px calc(22px + var(--sar)) 4px calc(22px + var(--sal)); flex-wrap: wrap; min-height: 46px; }
  /* 툴바와 필터 그룹 헤더가 함께 쓰는 개수 표시. 기본은 보통 굵기이고, 좁혀졌거나 선택된 개수만 굵게 강조한다 */
  .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .count b { color: var(--text); font-weight: 600; }
  .toolbar .count { font-size: 13px; }
  /* 그룹이 켜져 있을 때만 보이는 즐겨찾기 상단 고정 토글. 필터 패널의 체크박스 모양을 그대로 쓴다 */
  .favtop, .showlike { font-size: 12px; color: var(--muted); }
  .favtop { margin-left: auto; }
  .favtop[hidden] { display: none; }
  /* 썸네일 좋아요 표시 토글. 즐겨찾기 토글이 숨겨지면 대신 오른쪽 끝에 붙는다 */
  .showlike { margin-left: -8px; }
  .favtop[hidden] + .showlike { margin-left: auto; }
  /* 표시를 끄면 좋아요한 표지의 하트도 평소엔 감추고, 카드에 마우스를 올리거나 포커스했을 때만 보인다 */
  body.hide-like .card .likebtn { opacity: 0; }
  body.hide-like .card:hover .likebtn, body.hide-like .card:focus-visible .likebtn, body.hide-like .card .likebtn:focus-visible { opacity: 1; }
  /* 흑백으로 표시를 켜면 카드 썸네일과 확대 보기 이미지를 모두 흑백으로 보여 준다 */
  body.gray .card img, body.gray .lb .stage .pic { filter: grayscale(1); }
  body.gray .lb .stage .bg { filter: blur(32px) saturate(1.2) brightness(.75) grayscale(1); }
  /* 모바일 자막 띠의 흑백 토글. 하트 왼쪽에 BW 글자를 두른 원을 두고 켜지면 흰 원으로 채워 상태를 보여 준다 */
  .lb .cap .capgray { display: none; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 12px; }
  .chip .k { color: var(--faint); }
  .chip button { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .chip button:hover { background: #e2e2e6; color: var(--text); }
  /* 툴바의 필터 초기화와 필터 그룹 헤더의 초기화가 함께 쓰는 밑줄 링크 버튼 */
  .reset { font-size: 12px; font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
  .reset:hover { color: var(--text); }
  /* 즐겨찾기 모드에서 그룹 기준을 고르는 토글 줄 */
  .favbar { padding: 14px calc(22px + var(--sar)) 0 calc(22px + var(--sal)); }
  .favbar[hidden] { display: none; }
  .favbar h3 { margin: 0 0 10px; font-size: 17px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .favbar .keys { display: flex; gap: 6px; flex-wrap: wrap; }
  .favbar button { height: 30px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; color: var(--muted); }
  .favbar button:hover { background: var(--surface); color: var(--text); }
  .favbar button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .favbar button .n { margin-left: 5px; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  /* 좋아요 라벨 바에는 아래 내용이 없으므로 제목 밑 여백을 없앤다 */
  #likeBar h3 { margin-bottom: 0; }
  /* 라벨 바가 보이는 동안에는 툴바가 라벨 쪽에 붙도록 위 여백을 줄인다 */
  .favbar:not([hidden]) ~ .toolbar { padding-top: 4px; }
  .favbar button.on .n { color: rgba(255,255,255,.72); }
  /* 즐겨찾기가 하나도 없는 기준은 연하게 둔다 */
  .favbar button.dim { opacity: .4; }

  /* ---------- masonry ---------- */
  .grid { position: relative; margin: 8px 22px calc(60px + var(--sab)); }
  .card { position: absolute; top: 0; left: 0; width: var(--col-w); border-radius: var(--radius); overflow: hidden; background: var(--surface); cursor: zoom-in; transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s; will-change: transform; opacity: 0; }
  .card.in { opacity: 1; }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; background: var(--surface); }
  .card .ov { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.8) 55%, rgba(0,0,0,0) 100%); opacity: 0; transition: opacity .18s; padding: 56px 50px 14px 14px; color: #fff; }
  .card:hover .ov, .card:focus-visible .ov { opacity: 1; }
  .card .t { font-weight: 600; font-size: 14px; line-height: 1.3; text-shadow: 0 1px 8px rgba(0,0,0,.4); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .s { font-size: 12px; opacity: .85; margin-top: 4px; overflow: hidden; }
  .card .s > div { display: flex; flex-wrap: wrap; margin-left: -13px; }
  .card .s span { white-space: nowrap; }
  .card .s span::before { content: '·'; display: inline-block; width: 7px; margin-right: 6px; text-align: center; opacity: .6; }
  /* 클릭 영역과 SVG 뷰박스 안의 투명 영역을 감안해 보이는 하트 윤곽을 14px 여백에 맞춘다 */
  .card .likebtn { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; background: none; display: grid; place-items: center; color: #fff; filter: drop-shadow(0 1px 3px rgba(0,0,0,.6)); opacity: 0; transition: opacity .18s; z-index: 1; }
  .card:hover .likebtn, .card:focus-visible .likebtn, .card .likebtn.on, .card .likebtn:focus-visible { opacity: 1; }
  .card .likebtn svg { width: 28px; height: 28px; }
  .card .likebtn:not(.on):hover svg { fill: rgba(255,255,255,.35); }
  /* 출처의 원격 이미지를 못 받아 저장된 파일로 대체했을 때 이미지 오른쪽 아래에 두는 경고. 누르면 토스트로 안내한다 */
  .lost { position: absolute; right: 0; bottom: 0; z-index: 2; width: 56px; height: 56px; display: grid; place-items: center; color: #fff; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)) drop-shadow(0 0 6px rgba(0,0,0,.35)); }
  .lost svg { width: 36px; height: 36px; }
  .lost[hidden] { display: none; }
  /* 하트 아이콘 공통 규칙. 미선택은 외곽선만, 선택은 외곽선을 그대로 두고 안쪽만 분홍으로 채운다. 크기와 배치만 자리마다 정한다 */
  .like svg { fill: none; stroke: currentColor; stroke-width: 2; transition: fill .12s; }
  .like.on svg { fill: var(--like); stroke: #fff; }
  /* 상세창 헤더의 하트 토글. 제목 줄 오른쪽 끝에 아이콘만 두고, 음수 여백으로 아이콘 가장자리를 제목 위·본문 오른쪽 선에 맞춘다 */
  .lb .head { display: flex; align-items: flex-start; gap: 12px; }
  .lb .head > div { flex: 1; min-width: 0; }
  .lb .headlike { flex: none; width: 56px; height: 56px; margin: -10px -11px 0 0; display: grid; place-items: center; color: var(--muted); }
  .lb .headlike:hover { color: var(--text); }
  .lb .headlike.on { color: var(--like); }
  /* 흰 배경에서는 외곽선도 칠과 같은 핑크로 채워 한 덩어리로 보이게 한다 */
  .lb .headlike.on svg { stroke: var(--like); }
  .lb .headlike svg { width: 36px; height: 36px; }

  /* 제목·별·장수·핸들을 한 중심선에 두고 간격은 6px 로 통일한다 */

  /* 헤더 별표는 제목 글자와 같은 인라인 흐름에 두고 vertical-align 으로 맞춘다. 플렉스 baseline 정렬은 브라우저마다 svg 버튼의 기준선을 다르게 잡는다 */

  /* ---------- lightbox ---------- */
  .lb { position: fixed; inset: 0; z-index: 50; background: rgba(20,20,22,.72); backdrop-filter: blur(6px); display: none; }
  .lb.open { display: block; }
  .lb .sheet { position: absolute; top: 24px; bottom: 24px; left: 50%; transform: translateX(-50%); width: var(--sheet-w, 900px); max-width: calc(100vw - 152px); display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: 100%; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  /* 이전·현재·다음 세 칸짜리 트랙을 좌우로 끌어 넘긴다. 데스크톱과 모바일이 같은 구조를 쓴다 */
  .lb .stage { background: #000; position: relative; overflow: hidden; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; }

  .lb .slide { position: relative; flex: none; width: 33.3333%; height: 100%; overflow: hidden; background: #000; }
  /* 이미지가 채우지 못한 여백은 같은 이미지를 크게 흐려 채운다. 가장자리가 비치지 않도록 여유 있게 키운다 */
  .lb .stage .bg { position: absolute; inset: -48px; width: calc(100% + 96px); height: calc(100% + 96px); object-fit: cover; filter: blur(32px) saturate(1.2) brightness(.75); }
  .lb .stage .pic { position: relative; }
  .lb .nav { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 2px 10px rgba(0,0,0,.15); display: grid; place-items: center; color: var(--text); }

  /* 시트 너비가 표지마다 달라도 버튼은 화면 양끝에 붙여 자리를 고정한다. 시트 최대 너비가 양쪽 76px 을 남기므로 겹치지 않는다 */
  .lb .prev { left: 18px; }
  .lb .next { right: 18px; }
  .lb .back { display: none; position: absolute; top: 12px; left: 12px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.92); box-shadow: 0 2px 10px rgba(0,0,0,.18); color: var(--text); place-items: center; z-index: 2; }
  .lb .meta { padding: 28px 28px 24px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; }

  .lb .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .kv { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px 10px; font-size: 13px; }

  .lb .sub .flink { font-weight: 500; }
  .kv .ext { display: inline-flex; vertical-align: -3px; margin-left: 4px; color: var(--faint); text-decoration: none; }

  .kv .handle { margin-left: 6px; color: var(--faint); text-decoration: none; font-size: 12px; }
  .kv .handle:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .kv .fav { display: inline-flex; vertical-align: -0.15em; margin-left: 5px; }
  .kv .fav svg { width: 13px; height: 13px; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }

  /* 장면 분류 편집. localhost 로 접속했을 때만 상세창 제목 줄에 톱니 버튼이 나온다 */
  /* 톱니 버튼은 놓인 자리의 하트와 크기·색을 같게 하고 하트 바로 왼쪽에 둔다 */

  .se { position: fixed; inset: 0; z-index: 56; background: rgba(20,20,22,.5); backdrop-filter: blur(4px); display: none; place-items: center; padding: calc(20px + var(--sat)) calc(16px + var(--sar)) calc(20px + var(--sab)) calc(16px + var(--sal)); }

  .se .box { width: min(440px, 100%); max-height: 100%; overflow-y: auto; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 18px; }
  .se h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
  .se .who { margin-top: 4px; color: var(--muted); font-size: 13px; }

  .toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 60; }

  /* ---------- account ---------- */
  .acct { position: relative; display: flex; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--muted); }

  .scrim { display: none; }

  @media (max-width: 900px) {
    .header { gap: 10px; padding: var(--sat) calc(12px + var(--sar)) 0 calc(12px + var(--sal)); }
    .search { min-width: 140px; }

    .panel { position: fixed; left: 0; z-index: 40; box-shadow: 0 0 40px rgba(0,0,0,.12); width: fit-content; min-width: 172px; max-width: min(260px, 72vw); transition: transform .2s ease; }

    .toolbar { padding: 10px calc(12px + var(--sar)) 4px calc(12px + var(--sal)); }
    .favbar { padding: 10px calc(12px + var(--sar)) 0 calc(12px + var(--sal)); }
    .grid { margin: 8px 12px calc(60px + var(--sab)); }
    /* 모바일에서는 이미지를 화면 가로에 가득 채우고, 정보는 그 아래에 두어 세로로 스크롤한다 */
    /* 모바일은 릴스처럼 이미지가 화면을 채우고, 남는 영역은 같은 이미지를 크게 흐려 채운다.
       하단에는 제목 한 줄만 얹고, 탭하면 상세 정보 시트가 아래에서 올라온다 */
    .lb { background: #000; backdrop-filter: none; }
    .lb .sheet { top: 0; bottom: 0; left: 0; transform: none; width: 100vw; max-width: none; border-radius: 0; display: block; overflow: hidden; background: #000; box-shadow: none; }
    .lb .stage { position: absolute; inset: 0; cursor: default; }
    .lb .nav { display: none; }
    .lb .stage { -webkit-touch-callout: none; }

    .lb .stage .bg { transition: opacity .18s; }
    .lb.pulling .stage .bg { opacity: 0; }
    .lb .back { display: grid; position: fixed; top: calc(12px + var(--sat)); left: calc(12px + var(--sal)); background: rgba(0,0,0,.32); color: #fff; box-shadow: none; backdrop-filter: blur(6px); }
    /* 모바일은 아래쪽을 캡션이 차지하므로 경고를 오른쪽 위에 둔다 */
    .lb .lost { top: calc(4px + var(--sat)); right: calc(4px + var(--sar)); bottom: auto; }
    .lb .cap { display: flex; position: absolute; left: 0; right: 0; bottom: 0; padding: 64px calc(16px + var(--sar)) calc(18px + var(--sab)) calc(16px + var(--sal)); background: linear-gradient(to top, rgba(0,0,0,.78), rgba(0,0,0,.35) 55%, rgba(0,0,0,0)); color: #fff; align-items: flex-end; justify-content: space-between; gap: 12px; cursor: pointer; transition: opacity .2s; }
    /* 제목 칸이 남는 폭을 모두 차지해 흑백 토글과 하트가 오른쪽에 나란히 붙는다 */
    .lb .cap > div { flex: 1; min-width: 0; }
    .lb .cap h3 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; letter-spacing: -.01em; text-shadow: 0 1px 6px rgba(0,0,0,.5); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

    .lb .cap .flink:active { opacity: .7; }
    .lb .cap .caplike { flex: none; align-self: flex-start; width: 56px; height: 56px; margin: -10px -11px -6px 0; display: grid; place-items: center; color: #fff; background: none; border: 0; filter: drop-shadow(0 1px 4px rgba(0,0,0,.55)); transition: transform .12s; }
    .lb .cap .caplike:active, .lb .cap .capedit:active { transform: scale(.9); }
    .lb .cap .capedit:not([hidden]) { display: grid; flex: none; align-self: flex-start; width: 56px; height: 56px; margin: -10px -22px -6px 0; place-items: center; color: #fff; filter: drop-shadow(0 1px 4px rgba(0,0,0,.55)); transition: transform .12s; }
    .lb .cap .capedit svg { width: 36px; height: 36px; }
    .lb .cap .caplike svg { width: 36px; height: 36px; }
    .lb .cap .capgray { display: grid; flex: none; align-self: flex-start; width: 42px; height: 42px; margin: -3px -9px 0 0; place-items: center; color: #fff; filter: drop-shadow(0 1px 4px rgba(0,0,0,.55)); transition: transform .12s; }
    .lb .cap .capgray:active { transform: scale(.9); }
    /* 테두리 3px 은 하트 선 굵기와 같다. 하트는 24 단위에서 선 굵기 2 로 그려 36px 로 표시하므로 실제 3px 이다 */
    .lb .cap .capgray span { width: 32px; height: 32px; border-radius: 50%; border: 3px solid currentColor; display: grid; place-items: center; font: 700 12px/1 var(--font); letter-spacing: -.02em; transition: background .12s, color .12s; }
    .lb .cap .capgray.on span { background: #fff; border-color: #fff; color: #111; }
    .lb .graymeta { display: none; }
    .lb .dim { display: block; position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 2; }

  /* 헤더 한 줄에 모든 항목이 들어가지 않는 폭부터 제목과 슬라이더 글자를 감춰 가로 스크롤이 생기지 않게 한다 */

  }

  /* 헤더를 두 줄로: 위에 컨트롤, 아래에 검색창 */
  @media (max-width: 720px) {
    :root { --header-h: calc(104px + var(--sat)); }
    .header { flex-wrap: wrap; align-content: center; row-gap: 8px; padding: calc(8px + var(--sat)) calc(12px + var(--sar)) 8px calc(12px + var(--sal)); }
    .search { order: 5; flex-basis: 100%; min-width: 0; max-width: none; }

<script>
(async function () {
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5L20 7"/></svg>';

  let artists, publishers, novels, covers, builtAt = 0;
  if (window.COVER_DATA) {
    ({ artists, publishers, novels, covers, builtAt = 0 } = window.COVER_DATA);
  } else {
    try {
      [artists, publishers, novels, covers] = await Promise.all(['data/artists.json', 'data/publishers.json', 'data/novels.json', 'data/covers.json'].map(u => fetch(u).then(r => r.json())));
    } catch (e) {
      $('#grid').innerHTML = '<div class="empty"><b>데이터를 불러오지 못했습니다</b>data/data.js 가 없습니다. python tools/build_data.py 를 실행해 주세요.</div>';
      return;
    }
  }
  const A = Object.fromEntries(artists.map(a => [a.id, a]));
  const P = Object.fromEntries(publishers.map(p => [p.id, p]));
  const N = Object.fromEntries(novels.map(n => [n.id, n]));
  covers = covers.filter(c => N[c.novelId] || console.warn('작품 정보가 없는 표지', c.id));
  // 인물구성은 여성+남성+남성 처럼 등장하는 수만큼 이어 저장하고, 화면에는 항목마다 개수를 붙여 여성1+남성2 로 보여 준다
  const CAST_PARTS = ['여성', '남성', '여자아이', '남자아이', 'SD여성', 'SD남성', '동물'];
  function castLabel(v) {
    const n = new Map(); v.split('+').forEach(p => n.set(p, (n.get(p) || 0) + 1));
    return [...n].map(([p, k]) => p + k).join('+');
  }
  // 장면 분류 편집은 localhost 로 띄운 serve.py 에서만 쓸 수 있다
  const EDITABLE = ['localhost', '127.0.0.1'].includes(location.hostname);
  const searchText = c => [c._n.title, c.label, A[c.artistId]?.nickname, c._n.novelAuthor, P[c._n.publisherId]?.name, ...c._n.genres, ...c._n.tags, c.cast && castLabel(c.cast), ...c.animal, c.time, ...c.place].join(' ').toLowerCase();

    meta.addEventListener('lostpointercapture', e => { if (e.target === meta) pend(e); });
    window.addEventListener('pointerup', pend, true); window.addEventListener('pointercancel', pend, true);
    window.addEventListener('blur', () => { if (pid !== null) pend({ pointerId: pid }); });
    // 본문: 맨 위에서 아래로 끄는 터치만 가로챈다
    meta.addEventListener('touchstart', e => {
      if (!mobileLb.matches || !lb.classList.contains('info') || e.touches.length !== 1 || e.target.closest('.head, .grip')) return;
      tActive = true; tDecided = false; tsx = e.touches[0].clientX; begin(e.touches[0].clientY); active = false;
    }, { passive: true });
    meta.addEventListener('touchmove', e => {
      if (!tActive) return;
      const y = e.touches[0].clientY, x = e.touches[0].clientX;
      if (!tDecided) {
        tDecided = true;
        if (!(y - sy > 0 && Math.abs(y - sy) >= Math.abs(x - tsx) && meta.scrollTop <= 0)) { tActive = false; meta.classList.remove('dragging'); return; }
        active = true;
      }
      if (e.cancelable) e.preventDefault();
      move(y);
    }, { passive: false });
    const tend = () => { if (!tActive) return; tActive = false; if (active) finish(); else meta.classList.remove('dragging'); };
    meta.addEventListener('touchend', tend); meta.addEventListener('touchcancel', tend);
  })();
  lb.addEventListener('click', e => {
    if (Date.now() - lastSwipe < 400) return;
    const fs = e.target.closest('[data-fav]');
    if (fs) { toggleFav(fs.dataset.fav); return; }
    const f = e.target.closest('.flink');
    if (f) { const k = f.dataset.fk, v = f.dataset.fv; history.pushState(null, ''); KEYS.forEach(x => state.sel[x].clear()); state.q = ''; qEl.value = ''; state.sel[k].add(v); hideLb(); update(); toast(`${LABEL[k]} · ${nameOf(k, v)} 필터 적용`); return; }
    if (e.target.closest('#capLike')) { visible[cur] && toggleLike(visible[cur].id); return; }
    if (e.target.closest('#capEdit')) { visible[cur] && openSe(visible[cur].id); return; }
    if (e.target.closest('#capGray')) { setGray(!gray); return; }
    if (e.target.closest('#lbCap')) { lb.classList.add('info'); return; }
    if (e.target.closest('#lbGrip') || e.target === $('#lbDim') || (lb.classList.contains('info') && e.target.closest('.stage'))) { lb.classList.remove('info'); return; }
    if (!mobileLb.matches && (e.target === lb || e.target.classList.contains('stage'))) closeLb();
  });
  document.addEventListener('keydown', e => {
    if ($('#login').classList.contains('open')) { if (e.key === 'Escape') closeLogin(); return; }
    if (se.classList.contains('open')) { if (e.key === 'Escape') closeSe(); return; }
    if (!lb.classList.contains('open')) { if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } return; }
    if (e.key === 'Escape') { if (lb.classList.contains('info')) lb.classList.remove('info'); else closeLb(); } else if (e.key === 'ArrowLeft') $('#lbPrev').click(); else if (e.key === 'ArrowRight') $('#lbNext').click(); else if (e.key === 'f' || e.key === 'F') visible[cur] && toggleLike(visible[cur].id); else if (e.key === 'g' || e.key === 'G') setGray(!gray);
  });
  // ---------- 장면 분류 편집 ----------
  // localhost 로 띄운 serve.py 에서만 쓸 수 있다. 저장하면 서버가 data/scenes.json·covers.json·data.js 를 함께 고친다
  const se = $('#se');
  let draft = null, editId = null;
  const castText = d => CAST_PARTS.flatMap(k => Array(d.n[k]).fill(k)).join('+');
  // 동물·장소처럼 여러 값을 고르는 항목. 칩을 눌러 켜고 끄며, 목록에 없는 값은 입력칸으로 더한다
  const SE_LISTS = ['animal', 'place'];
  function openSe(id) {
    const c = covers.find(x => x.id === id); if (!c) return;
    editId = c.id;
    const parts = c.cast ? c.cast.split('+') : [];
    draft = { n: Object.fromEntries(CAST_PARTS.map(k => [k, parts.filter(p => p === k).length])), animal: [...c.animal], time: c.time || '', space: c.space || '', place: [...c.place] };
    $('#seWho').textContent = `${A[c.artistId]?.nickname || ''} · ${coverTitle(c)}`;
    $$('[data-add]', se).forEach(i => i.value = '');
    renderSe(); se.classList.add('open');
  }
  function closeSe() { se.classList.remove('open'); draft = editId = null; }
  function renderSe() {
    const chip = (attr, v, on, label = v) => `<button type="button" class="chip${on ? ' on' : ''}" ${attr}="${esc(v)}">${esc(label)}</button>`;
    $('#seCast').innerHTML = CAST_PARTS.map(k => `<span class="step"><button type="button" data-dec="${k}" aria-label="${k} 빼기">−</button><span>${k}<b class="${draft.n[k] ? '' : 'zero'}">${draft.n[k]}</b></span><button type="button" data-inc="${k}" aria-label="${k} 더하기">+</button></span>`).join('');
    $('#seCastText').textContent = castText(draft) ? castLabel(castText(draft)) : '없음';
    $('#seTime').innerHTML = ['', ...TIMES].map(v => chip('data-time', v, draft.time === v, v || '없음')).join('');
    $('#seSpace').innerHTML = ['', '실내', '실외'].map(v => chip('data-space', v, draft.space === v, v || '없음')).join('');
    // 고른 값을 앞에 두고, 나머지는 다른 표지에 쓰인 값을 많이 쓰인 순으로 늘어놓는다
    for (const k of SE_LISTS) {
      const used = new Map(); covers.forEach(c => c[k].forEach(p => used.set(p, (used.get(p) || 0) + 1)));
      const rest = [...used.keys()].filter(p => !draft[k].includes(p)).sort((a, b) => used.get(b) - used.get(a) || a.localeCompare(b, 'ko'));
      $(`[data-list="${k}"]`, se).innerHTML = [...draft[k].map(p => chip(`data-${k}`, p, true)), ...rest.map(p => chip(`data-${k}`, p, false))].join('');
    }
  }
  function addItem(k) { const i = $(`[data-add="${k}"]`, se), v = i.value.trim(); if (v && !draft[k].includes(v)) draft[k].push(v); i.value = ''; renderSe(); }
  se.addEventListener('click', e => {
    if (e.target === se) { closeSe(); return; }
    const b = e.target.closest('button'); if (!b || !draft) return;
    const d = b.dataset, lk = SE_LISTS.find(k => d[k]);
    if (d.inc) draft.n[d.inc]++;
    else if (d.dec) draft.n[d.dec] = Math.max(0, draft.n[d.dec] - 1);
    else if ('time' in d) draft.time = d.time;
    else if ('space' in d) draft.space = d.space;
    else if (lk) draft[lk] = draft[lk].includes(d[lk]) ? draft[lk].filter(p => p !== d[lk]) : [...draft[lk], d[lk]];
    else if (d.addbtn) { addItem(d.addbtn); return; }
    else return;
    renderSe();
  });
  se.addEventListener('keydown', e => { const k = e.target.dataset?.add; if (k && e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addItem(k); } });
  $('#seCancel').onclick = closeSe;
  $('#lbEdit').onclick = () => visible[cur] && openSe(visible[cur].id);
  $('#seSave').onclick = async () => {
    const id = editId, scene = { cast: castText(draft), animal: draft.animal, time: draft.time, space: draft.space, place: draft.place };
    $('#seSave').disabled = true;
    try {
      const r = await fetch('api/scene', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, ...scene }) });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || r.status);
      const c = covers.find(x => x.id === id);
      Object.assign(c, body); c._search = searchText(c);
      closeSe(); update();
      // 상세창에서 고쳤다면 그 표지를 다시 띄우고, 바뀐 값 때문에 현재 필터에서 빠지면 상세창을 닫는다
      const i = visible.findIndex(x => x.id === id);
      if (!lb.classList.contains('open')) toast(i < 0 ? '저장했습니다. 현재 필터에서는 빠졌습니다' : '저장했습니다', i < 0 ? 2200 : 1500);
      else if (i < 0) { closeLb(); toast('저장했습니다. 현재 필터에서는 빠졌습니다', 2200); } else { openLb(i, true); toast('저장했습니다'); }
    } catch (err) { toast(`저장하지 못했습니다: ${err.message}`, 3000); }
    finally { $('#seSave').disabled = false; }
  };
  function toast(msg, ms = 1500) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms); }

  // ---------- header controls ----------
  const qEl = $('#q'); let qt;
  qEl.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { state.q = qEl.value.trim().toLowerCase(); update(); }, 120); });
  $('#qClear').onclick = () => { qEl.value = ''; state.q = ''; update(); qEl.focus(); };
  $('#likeToggle').onclick = () => { if (!auth && !state.like) { openLogin(); return; } state.like = !state.like; if (state.like) state.favMode = false; update(); };
  // 즐겨찾기 모드. 그룹 기준은 아래 토글 줄에서 고른 favKey 를 쓰고, 그동안 그룹 드롭다운은 비활성으로 둔다
  $('#favToggle').onclick = () => {
    if (!state.favMode && !auth) { openLogin(); return; }
    state.favMode = !state.favMode;
    if (state.favMode) state.like = false;
    // 켤 때 지금 기준에 즐겨찾기가 없으면 즐겨찾기가 있는 첫 기준을 고른다
    const has = k => [...favs].some(id => id.startsWith(k + ':'));
    if (state.favMode && !has(state.favKey)) state.favKey = KEYS.find(has) || state.favKey;
    update();
  };
  $('#favBar').addEventListener('click', e => { const b = e.target.closest('[data-favkey]'); if (b) { state.favKey = b.dataset.favkey; update(); } });
  $('#sort').onchange = e => { state.sort = e.target.value; if (state.sort === 'random') covers.forEach(c => c._rand = Math.random()); update(); };
  $('#group').onchange = e => { state.group = e.target.value; update(); };
  colW = +localStorage.getItem('colW') || (innerWidth < 600 ? 160 : 240);
  // 화면 폭이 달라져도 비슷한 크기가 유지되도록 열 개수가 아니라 열 너비를 저장한다
  size.addEventListener('input', () => { const n = +size.value; colW = Math.floor((grid.clientWidth - gap * (n - 1)) / n); localStorage.setItem('colW', colW); relayout(); });
  const panel = $('#panel');
  const setPanel = open => { panel.classList.toggle('hidden', !open); document.body.classList.toggle('panel-open', open); $('#togglePanel').classList.toggle('on', open); localStorage.setItem('panel', open ? '1' : '0'); setTimeout(relayout, 220); };
  $('#togglePanel').onclick = () => setPanel(panel.classList.contains('hidden'));
  $('#scrim').onclick = () => setPanel(false);
  // 사이드바 너비 드래그 조절
  const PANEL_MIN = 180, PANEL_MAX = 520;
  const setPanelW = w => { w = Math.max(PANEL_MIN, Math.min(PANEL_MAX, Math.round(w))); document.documentElement.style.setProperty('--panel-w', w + 'px'); return w; };
  setPanelW(+localStorage.getItem('panelW') || 264);
  $('#resizer').addEventListener('pointerdown', e => {
    e.preventDefault(); const startX = e.clientX, startW = panel.getBoundingClientRect().width;
    document.body.classList.add('resizing'); let w = startW;
    const move = ev => { w = setPanelW(startW + ev.clientX - startX); };
    const up = () => { document.body.classList.remove('resizing'); localStorage.setItem('panelW', w); window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); relayout(); };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
  });
  $('#resizer').addEventListener('dblclick', () => { setPanelW(264); localStorage.setItem('panelW', 264); relayout(); });

  // ---------- update ----------
  function update() {
    const matched = covers.filter(c => matches(c));
    visible = sorted(matched);
    const total = state.like || state.favMode ? covers.filter(inMode).length : covers.length;
    $('#count').innerHTML = matched.length !== total ? `<b>${matched.length}</b> / ${total}` : `${matched.length} / ${total}`;
    $('#favTop').hidden = !state.group || state.favMode; $('#favTopCb').checked = favTop;
    $('#favToggle').classList.toggle('on', state.favMode);
    $('#favBar').hidden = !state.favMode;
    $('#likeBar').hidden = !state.like;
    if (state.favMode) $('#favKeys').innerHTML = KEYS.map(k => { const n = [...favs].filter(id => id.startsWith(k + ':')).length; return `<button type="button" class="${k === state.favKey ? 'on' : ''}${n ? '' : ' dim'}" data-favkey="${k}">${LABEL[k]}<span class="n">${n}</span></button>`; }).join('');
    $('#group').disabled = state.favMode;
    $('#searchWrap').classList.toggle('has', !!state.q);
    $('#likeToggle').classList.toggle('on', state.like);
    renderChips(); renderPanel(); writeHash(); resetGrid();
  }
  readHash();
  qEl.value = state.q; $('#sort').value = state.sort; $('#group').value = state.group;
  // 저장된 닫힘 상태를 복원할 때는 여닫기 애니메이션을 건너뛴다. 접히는 도중에 그리드 너비를 재면 오른쪽에 빈 여백이 남기 때문이다
  const panelPref = localStorage.getItem('panel');
  document.body.classList.add('noanim');
  panel.classList.toggle('hidden', panelPref === '0' || (panelPref === null && innerWidth < 900));
  document.body.classList.toggle('panel-open', !panel.classList.contains('hidden'));
  $('#togglePanel').classList.toggle('on', !panel.classList.contains('hidden'));
  window.addEventListener('hashchange', () => { const prev = filterHash().toString(); readHash(); qEl.value = state.q; $('#sort').value = state.sort; $('#group').value = state.group; if (filterHash().toString() !== prev) update(); syncLb(); });
  setUser(auth?.user || null);
  // 토큰이 살아 있으면 드라이브와 맞추고, 만료됐으면 캐시로 보여 주다가 다음 클릭에서 다시 로그인한다. 첫 렌더가 동기화 중임을 알 수 있게 먼저 시작한다
  if (auth) sync();
  update();
  syncLb();
  requestAnimationFrame(() => document.body.classList.remove('noanim'));
})();
</script>
</body>
</html>
